# Pilot run on a 2-vCPU cloud workspace (harness validation only).
# llama.cpp llama-server, one server per model; greedy decoding.
# --cache-ram 0: the host-memory prompt cache (default 8 GiB) exhausted the 8 GB host
# during the first DeepSeek pass (OOM kill); disabled from the restart on.
run_id: pilot-cpu-2026-10
endpoint: http://127.0.0.1:8081
families: [F2]
samples:
  - {idx: 0, temperature: 0.0, seed: 20240628}
resample: {n: 3, temperature: 0.7, seeds_from: 1, concurrency: 4}   # sampled pass: 4 server slots
concurrency: 1               # greedy passes: one request at a time
params:
  top_p: 1.0
  max_tokens: {F1: 512, F2: 384}   # F1: every template asks for the manifest before the code
  repeat_penalty: 1.1        # only non-default decoding parameter of the pilot (llama.cpp default 1.0)
llama_cpp_commit: 06230cb8775899cceef146c19cd447a947ecac5b
models:
  - id: qwen2.5-coder-1.5b-instruct
    families: [F1, F2]         # F1 (manifest + code) for this model only
    family_name: Qwen2.5-Coder
    params_b: 1.5
    quant: Q4_K_M (GGUF, Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF)
    file: /home/claude/models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
    sha256: cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046
    horizon: "2024-09-18T09:41:47Z"
    horizon_source: "Hugging Face createdAt of Qwen/Qwen2.5-Coder-1.5B-Instruct (upper bound on training cut-off)"
    server_cmd: "/home/claude/tools/llama.cpp/build/bin/llama-server -m {file} --host 127.0.0.1 --port 8081 -t 2 -c 4096 --cache-ram 0 --no-webui"
  - id: deepseek-coder-1.3b-instruct
