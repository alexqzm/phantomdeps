# Study configuration (run by the author on local hardware with Ollama; Windows kit: tools/study_kit/).
# Weights: every model is the hub GGUF file pinned below (gguf_repo at gguf_revision, gguf_file, size,
# sha256 = the file's SHA-256, which is also the Ollama blob digest after import).  The runner
# (tools/study_runner.py) downloads the file, checks size and SHA-256, and imports it with
# `ollama create <endpoint_model>`; `make horizons` anchors each model's horizon on these files
# (PROTOCOL.md, section 4).  Quantisation follows the Ollama library default of the same model
# (Q4_K_M; Q4_0 for the two DeepSeek-Coder models; MXFP4 for gpt-oss).
# Prompt format: the chat template, default system message and default parameters are those of the
# Ollama library tag `library_tag` (config/ollama_library/<id>/, copied from registry.ollama.ai with
# their layer digests), so that a model differs from the library model only in its weight file;
# for granite3.3:8b the library weight layer is this very file.  `horizon` keeps the createdAt of
# the vendor repository for comparison only; analysis uses data/derived/model_horizons.json.
#
# Server: one request at a time and a context large enough for the reasoning models:
#   OLLAMA_CONTEXT_LENGTH=8192 OLLAMA_NUM_PARALLEL=1 ollama serve
# On a 12 GB GPU the models up to 16B run fully on the GPU; gpt-oss-20b and qwen2.5-coder-32b
# offload layers to system RAM and are slower.  The runner is resumable.
#
# Both families get one token budget (PROTOCOL v1.3).  Reasoning models (qwen3, gpt-oss) think
# before answering; their budget is raised so that the final answer fits.  Only the final answer is
# analysed; reasoning returned separately is stored as reasoning_text, and inline <think>...</think>
# blocks are stripped before extraction.
run_id: study-ollama-2027
server: ollama               # record /api/show and /api/tags provenance per model
endpoint: http://127.0.0.1:11434
families: [F1, F2]
samples:                     # greedy pass; persistence pass via `resample` (see README)
  - {idx: 0, temperature: 0.0, seed: 20240628}
resample: {n: 5, temperature: 0.7, seeds_from: 1, concurrency: 1}   # >1 needs OLLAMA_NUM_PARALLEL>1
params:
  top_p: 0.95
  max_tokens: {F1: 1536, F2: 1536}
