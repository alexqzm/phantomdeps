# Pilot extension (revision of 2026-10-24): larger instruction models on the same 2-vCPU host,
# llama.cpp llama-server, one server per model, greedy decoding.  Three are analysed (two of the
# pilot's families and Phi-3-mini of a fourth vendor); the Granite run was stopped (see its entry).  Same corpus, system prompt and primary
# family (F2) as the pilot; the token budget for F2 is raised from 384 to 1024 so that answers
# finish (PROTOCOL.md, change log).
# Weights: the GGUF files named below (SHA-256 recorded); the vendor's own GGUF where one
# exists.  `horizon` keeps the Hugging Face createdAt of the source repository for
# comparison only; the analysis uses the weight-anchored horizons of
# data/derived/model_horizons.json (tools/model_horizons.py).
run_id: pilot-cpu-ext-2026-10
endpoint: http://127.0.0.1:8081
families: [F2]
samples:
  - {idx: 0, temperature: 0.0, seed: 20240628}
concurrency: 1               # one request at a time
params:
  top_p: 1.0
  max_tokens: {F1: 1536, F2: 1024}
  repeat_penalty: 1.1        # as in the pilot
llama_cpp_commit: 06230cb8775899cceef146c19cd447a947ecac5b
models:
  - id: qwen2.5-coder-7b-instruct
    family_name: Qwen2.5-Coder
