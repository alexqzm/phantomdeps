# PhantomDeps-CPS task corpus v1.0
# 8 ecosystems x 12 tasks = 96 tasks.  Tasks describe function and hardware only;
# they never name a library, crate, component or package (the one exception is a
# standard ROS message type where it defines the required interface), so every
# dependency name in a response is chosen by the model.
# tier (assigned a priori by the authors before any generation):
#   common = widely documented hobby/industrial component or protocol
#   niche  = less common device, fieldbus or security function
# cat: sensing | actuation | iot | fieldbus | positioning | security | control | data | display | wireless | robotics

version: "1.0"

ecosystems:
  arduino:
    label: Arduino Library Manager
    templates:
      F1: >-
        I'm using the Arduino IDE with the Library Manager. Board: {board}. Task: {task}
        First list the exact libraries I must install as `arduino-cli lib install` commands,
        then give the complete sketch.
      F2: >-
        I'm using the Arduino IDE with the Library Manager. Board: {board}. Task: {task}
        Only list the exact libraries I must install, as `arduino-cli lib install` commands. Do not write the sketch.
  platformio:
    label: PlatformIO Registry
    templates:
      F1: >-
        Create a PlatformIO project for {board} using the Arduino framework. Task: {task}
        Provide the complete platformio.ini (including lib_deps) and src/main.cpp.
      F2: >-
        Create a PlatformIO project for {board} using the Arduino framework. Task: {task}
        Provide only the complete platformio.ini, including lib_deps. Do not write the source code.
  espidf:
    label: ESP Component Registry
    templates:
      F1: >-
        Create an ESP-IDF v5.x project for {board}. Task: {task}
        Use components from the ESP Component Registry where appropriate. Show the full
        main/idf_component.yml and main/main.c.
      F2: >-
        Create an ESP-IDF v5.x project for {board}. Task: {task}
        Use components from the ESP Component Registry where appropriate. Show only the full
        main/idf_component.yml. Do not write the source code.
  ros2:
    label: ROS 2 (rosdistro, rosdep)
    templates:
      F1: >-
        Create a ROS 2 Humble package for {board}. Task: {task}
        Show the complete package.xml and the main source file.
      F2: >-
        Create a ROS 2 Humble package for {board}. Task: {task}
        Show only the complete package.xml with all dependencies. Do not write the source code.
  crates:
    label: crates.io (embedded Rust)
    templates:
      F1: >-
        Write an embedded Rust (no_std) project for {board}. Task: {task}
        Show the full Cargo.toml with all dependencies and src/main.rs.
      F2: >-
        Write an embedded Rust (no_std) project for {board}. Task: {task}
        Show only the full Cargo.toml with all dependencies. Do not write the source code.
  micropython:
    label: micropython-lib (mip)
    templates:
      F1: >-
        Write a MicroPython program for {board}. Task: {task}
        Show how to install every required package on the device with mip
        (for example mip.install(...)) and give the full main.py.
      F2: >-
        Write a MicroPython program for {board}. Task: {task}
        Only show the mip commands (for example mip.install(...)) that install every required package. Do not write main.py.
  pypi:
    label: PyPI (CPS gateway)
    templates:
      F1: >-
        Write a Python 3 program for {board}. Task: {task}
        Provide requirements.txt with all pip packages and the main script.
      F2: >-
        Write a Python 3 program for {board}. Task: {task}
        Provide only requirements.txt with all pip packages. Do not write the script.
  npm:
    label: npm (Node-RED palette)
    templates:
      F1: >-
        I want to build a Node-RED flow running on {board}. Task: {task}
        Which Node-RED node packages do I need? Give the exact `npm install` commands to run
        in ~/.node-red and then describe the flow.
      F2: >-
        I want to build a Node-RED flow running on {board}. Task: {task}
        Only give the exact `npm install` commands (run in ~/.node-red) for the Node-RED node packages I need.

